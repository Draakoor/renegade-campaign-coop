name: Build and publish GHCR image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Verify generated Pterodactyl egg
        run: |
          python tools/make_egg.py
          git diff --exit-code -- egg-renegade-campaign-coop.json

  plugin:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch and verify Dragonade release
        run: python tools/fetch_inputs.py --work build/inputs --only dragonade
      - name: Build x86 campaign plugin
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC installation not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars32.bat'
          @(
            '@echo off'
            "call `"$vcvars`""
            'if errorlevel 1 exit /b %errorlevel%'
            'python tools/build_plugin.py --dragonade build/inputs/da --output build/plugin'
            'exit /b %errorlevel%'
          ) | Set-Content build/plugin-build.cmd -Encoding ascii
          & cmd.exe /d /c build\plugin-build.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: campaign-plugin
          path: build/plugin/da_campaign.dll
          if-no-files-found: error
          retention-days: 14

  image:
    needs: [test, plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: campaign-plugin
          path: artifacts
      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: renegade-coop:ci
          build-args: |
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test packaged runtime and asset guard
        shell: bash
        run: |
          docker run --rm renegade-coop:ci wine --version
          docker run --rm renegade-coop:ci python3 -c 'import os,pathlib,sys; sys.path.insert(0,"/opt/renegade-coop"); import runtime; p=pathlib.Path("/opt/renegade-coop/artifacts/da_campaign.dll"); assert p.read_bytes()[:2]==b"MZ"; assert runtime.ROOT==pathlib.Path("/home/container"); assert os.getuid()==1000; (runtime.ROOT/"write-check").write_text("ok")'
          set +e
          docker run --rm renegade-coop:ci > missing-assets.log 2>&1
          code=$?
          set -e
          cat missing-assets.log
          test "$code" -eq 1
          grep -F 'Supply CoopBeta424.zip and the original FDS server.dat in input/' missing-assets.log
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Record immutable image reference
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "Published: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Development runtime only; campaign acceptance remains pending.' >> "$GITHUB_STEP_SUMMARY"
