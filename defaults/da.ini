[General]
GameMode=Campaign
ShowGameModeTitle=0
LogPort=0
EnableGameLog=0
ForceTeam=1
RemixFrequency=0
SwapChance=0
EnableRebalance=0
EnableFreeTeamChanging=0
EnableRTC=0
EnableGameSpy=1
; Keep validation servers out of community lists. Runtime owns public heartbeats.
GameSpyMasterServers=127.0.0.1
GameSpyQueryPort=35001
GameSpyShowPlayerCount=0
EnableLoot=0
EnableParachutes=0
EnableSquads=0
EnableDonate=0
EnableVehicleOwnership=0
EnableVehicleShells=0
EnableVehicleQueue=0
EnableInfiniteAmmo=0
EnableNoReload=0
EnableCrates=0
EnableKillStreaks=0
EnableBuildingAnnotations=0
TimeLimitMinutes=0
IsFriendlyFirePermitted=0
IsTeamChangingAllowed=0
SpawnProtection=3
; Shared mission keys survive player deaths and synchronize late joins.
CampaignSharedKeys=1
; Seconds after collecting a map-placed weapon/key. 0 disables replenishment.
; NPC/player drops are excluded. Existing native repeating spawners stay native.
CampaignWeaponRespawnSeconds=15
CampaignKeyRespawnSeconds=5
; Keep original CoopBeta stations; add matching stations on M06/M07/M09.
CampaignTerminals=1
; Catch up to reached checkpoints/supply points or a connected teammate.
CampaignCatchup=1
CampaignPlayerGoto=1
CampaignCatchupWarmupSeconds=3
CampaignCatchupCombatSeconds=10
CampaignCatchupCooldownSeconds=30
; Cosmetic skins preserve the purchased class and equipment.
CampaignSkins=1
CampaignAdminVehicleLimit=20
; Strict integer credit transfers; leave Dragonade EnableDonate=0 above.
CampaignDonations=1
; Nickname permits requesting access only. !admin needs panel confirmation
; for each connection; never grants rights solely by name. Empty disables it.
CampaignAdminName=

[Plugins]
da_campaign.dll=1

[GameSpyRules]
Owner=Novara
Mode=Campaign Coop
Validation=pending

