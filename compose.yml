services:
  renegade:
    image: ghcr.io/draakoor/renegade-campaign-coop:main
    stdin_open: true
    tty: true
    init: true
    stop_grace_period: 45s
    mem_limit: 2g
    cpus: 2.0
    environment:
      TT_DOWNLOAD_URL: ${TT_DOWNLOAD_URL:?Set TT_DOWNLOAD_URL in .env}
      RELEASE_MODE: development
    ports:
      - "35000:35000/udp"
      - "35001:35001/udp"
      - "35002:35002/tcp"
    volumes:
      - ./volume:/home/container
